# RSS Feeds - bar widget styled like the other chips in the owner's bar.
# The chip shows the newest headline of all configured feeds; clicking opens
# a panel with one section per feed whose entries open in the browser via
# xdg-open. Feed fetching/parsing lives in scripts/rss_fetcher.py, the
# shared service publishes results to bar and panel through noctalia.state.
id = "roman/rss-feeds"
name = "RSS Feeds"
version = "1.0.0"
plugin_api = 24
author = "roman"
license = "MIT"
dependencies = ["python", "curl", "xdg-open"]
tags = ["rss", "news", "utility"]
icon = "rss"
description = "RSS/Atom headlines as a bar widget with an entry list panel."

[[setting]]
key = "feed_1"
type = "string"
label_key = "settings.feed1.label"
default = ""

[[setting]]
key = "title_1"
type = "string"
label_key = "settings.title1.label"
default = ""

[[setting]]
key = "feed_2"
type = "string"
label_key = "settings.feed2.label"
default = ""

[[setting]]
key = "title_2"
type = "string"
label_key = "settings.title2.label"
default = ""

[[setting]]
key = "feed_3"
type = "string"
label_key = "settings.feed3.label"
default = ""

[[setting]]
key = "title_3"
type = "string"
label_key = "settings.title3.label"
default = ""

[[setting]]
key = "feed_4"
type = "string"
label_key = "settings.feed4.label"
default = ""

[[setting]]
key = "title_4"
type = "string"
label_key = "settings.title4.label"
default = ""

[[setting]]
key = "feed_5"
type = "string"
label_key = "settings.feed5.label"
default = ""

[[setting]]
key = "title_5"
type = "string"
label_key = "settings.title5.label"
default = ""

[[setting]]
key = "items_per_feed"
type = "int"
label_key = "settings.items.label"
default = 5

[[setting]]
key = "refresh_minutes"
type = "int"
label_key = "settings.refresh.label"
default = 30

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 420
height = 540
placement = "attached"
