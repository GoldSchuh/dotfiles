# ~/.config/kitty/kitty.conf

include colors.conf

# font
font_family        family="JetBrains Mono" style="Regular"
bold_font          family="JetBrains Mono" style="Bold"
italic_font        family="JetBrains Mono" style="Italic"
bold_italic_font   family="JetBrains Mono" style="Bold Italic"
font_size          11.5
modify_font        cell_height 4px

# window
hide_window_decorations yes
window_padding_width    10
remember_window_size    no
background_opacity      0.95

# tabs
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      2

# behavior
scrollback_lines 10000
enable_audio_bell no
cursor_shape      beam
cursor_beam_thickness 1.3
cursor_trail      yes
copy_on_select    yes
confirm_os_window_close 0
wayland_enable_ime yes

# font code ligatures
disable_ligatures never
